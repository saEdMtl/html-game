<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>بازی کاشت تریاک</title>
<style>
:root{--panel:#3a2d21;--gold:#f0bf55;--red:#e0483a;--ok:#8fd16a;--txt:#f6e9d2;--mut:#d2c3a8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{background:#8fb7dd;color:var(--txt);font-family:Vazirmatn,Tahoma,"Segoe UI",sans-serif;touch-action:manipulation}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#app{position:fixed;inset:0;z-index:1;pointer-events:none;max-width:720px;margin:0 auto;padding:max(8px,env(safe-area-inset-top)) 10px max(8px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:7px}
#app>*{pointer-events:auto}
#app>.sp{flex:1;pointer-events:none}
h1{margin:0;font-size:clamp(1rem,4vw,1.3rem);text-align:center;color:#fff;text-shadow:0 2px 6px #000a;pointer-events:none}
.bar{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.stat{background:#2b2016d9;backdrop-filter:blur(4px);border:1px solid #6a5238;border-radius:10px;padding:5px 8px;min-width:0}
.stat small{color:var(--mut);display:block;font-size:clamp(.6rem,2.4vw,.72rem);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat b{font-size:clamp(.85rem,3.6vw,1.1rem);white-space:nowrap;display:inline-block}
#money b{color:var(--gold)}
#money.bump b{animation:bump .5s}
#stock.full b{color:var(--red)}
#price.up b{color:var(--ok)}#price.down b{color:var(--red)}
#price.flash{animation:flash .7s}
.row{display:flex;gap:6px}
button{font:inherit;font-size:clamp(.72rem,3vw,.95rem);background:linear-gradient(180deg,#f7cd6c,#e0a63a);color:#2b2118;border:0;border-radius:10px;padding:10px 6px;font-weight:700;cursor:pointer;flex:1;box-shadow:0 3px 0 #9a6f1d;transition:transform .1s,box-shadow .1s}
button:active{transform:translateY(3px);box-shadow:0 0 0 #9a6f1d}
button:disabled{opacity:.4;cursor:not-allowed}
button.alt{background:linear-gradient(180deg,#5a4631,#46372a);color:var(--txt);box-shadow:0 3px 0 #2a1f15}
:focus-visible{outline:3px solid #fff;outline-offset:2px}
#trip{background:#2b2016d9;backdrop-filter:blur(4px);border-radius:10px;padding:6px 10px;border:1px solid #6a5238}
#tripText{font-size:clamp(.7rem,3vw,.85rem);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#pgw{height:4px;background:#0006;border-radius:2px;margin-top:5px;overflow:hidden}
#pg{height:100%;width:0;background:linear-gradient(90deg,#8fd16a,#f0bf55)}
#log{height:3.6em;overflow:hidden;font-size:clamp(.68rem,2.8vw,.8rem);color:var(--mut);line-height:1.3;text-shadow:0 1px 3px #000}
#log div:first-child{color:#fff}
#log div{animation:slide .3s}
.fl{position:fixed;z-index:9;pointer-events:none;font-weight:800;font-size:1.1rem;transform:translateX(-50%);text-shadow:0 2px 4px #000;animation:rise 1s ease-out forwards}
.fl.g{color:var(--ok)}.fl.r{color:#ff8a7a}
.coin{position:fixed;z-index:9;pointer-events:none;font-size:1.3rem;animation:burst 1s ease-out forwards}
#toast{position:fixed;left:50%;top:22%;transform:translateX(-50%) scale(.6);z-index:10;background:#000c;color:#fff;border:2px solid var(--gold);padding:10px 18px;border-radius:14px;font-weight:700;opacity:0;pointer-events:none;text-align:center;max-width:90vw}
#toast.show{animation:toast 2.4s forwards}
#toast.bad{border-color:var(--red)}
#flash{position:fixed;inset:0;background:radial-gradient(circle,transparent 40%,#f00 130%);opacity:0;pointer-events:none;z-index:8}
#flash.on{animation:fl .7s}
.shake{animation:shake .5s}
button small{display:block;font-size:.68em;font-weight:600;opacity:.85;margin-top:1px}
#lock{margin-top:5px;font-size:clamp(.7rem,3vw,.85rem);color:#ffd54a;font-weight:700}
#raid{position:fixed;inset:0;z-index:15;background:#000b;display:flex;align-items:center;justify-content:center;padding:16px}
#raid[hidden]{display:none}
#raid .card{background:#2b2016;border:2px solid #e0483a;border-radius:16px;padding:16px;width:min(380px,100%);display:flex;flex-direction:column;gap:8px;text-align:center;animation:toast2 .4s}
#raid h2{margin:0;font-size:1.3rem;animation:sir .6s steps(2) infinite}
#raid p{margin:0;font-size:.9rem;line-height:1.7;color:var(--mut)}
#rbar{height:5px;background:#0008;border-radius:3px;overflow:hidden}#rbar div{height:100%;width:100%;background:var(--red)}
#raid button{flex:none;padding:12px 8px}
@keyframes sir{0%{color:#ff5a4a}100%{color:#5a8aff}}
@keyframes toast2{from{transform:scale(.7);opacity:0}}
#err{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;background:#2b2016;color:#fff;text-align:center;padding:20px;line-height:2}
@keyframes bump{40%{transform:scale(1.35);color:#fff}}
@keyframes flash{30%{background:#6b5328}}
@keyframes slide{from{opacity:0;transform:translateY(-6px)}}
@keyframes rise{from{opacity:1}to{opacity:0;transform:translate(-50%,-60px) scale(1.3)}}
@keyframes burst{to{opacity:0;transform:translate(var(--dx),var(--dy)) rotate(360deg) scale(.5)}}
@keyframes toast{12%{opacity:1;transform:translateX(-50%) scale(1.08)}20%{transform:translateX(-50%) scale(1)}80%{opacity:1}100%{opacity:0}}
@keyframes fl{50%{opacity:.7}}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="gl"></canvas><div id="flash"></div><div id="toast"></div>
<div id="raid" hidden><div class="card"><h2>🚔 پلیس آمد!</h2><p id="raidTxt"></p><div id="rbar"><div></div></div>
<button id="b1"></button><button id="b2"></button><button id="b3" class="alt">رشوه نمی‌دهم</button>
<p>رشوه بیشتر شانس قبول شدن را بالاتر می‌برد. اگر قبول نکند، پولت را نمی‌گیرد.</p></div></div>
<div id="err">برای نمایش سه‌بعدی، کتابخانه three.js باید بارگذاری شود.<br>به اینترنت وصل شو و صفحه را دوباره باز کن.</div>
<div id="app">
  <h1>🌺 بازی کاشت تریاک</h1>
  <div class="bar">
    <div class="stat" id="money"><small>پول</small><b>0</b></div>
    <div class="stat" id="stock"><small>انبار (کیلو)</small><b>0</b></div>
    <div class="stat" id="price"><small>قیمت هر کیلو</small><b>0</b></div>
    <div class="stat" id="land"><small>زمین‌ها</small><b>0</b></div>
  </div>
  <div class="sp"></div>
  <div class="row">
    <button id="plantAll">🌱 کاشت<small>بذر ۲۰ برای هر زمین</small></button>
    <button id="harvestAll" class="alt">🧺 برداشت<small>همه آماده‌ها</small></button>
    <button id="upg" class="alt">📦 انبار<small id="upgc"></small></button>
    <button id="sell">🛒 بفروش<small>ببر بازار</small></button>
  </div>
  <div id="trip"><div id="tripText"></div><div id="pgw"><div id="pg"></div></div><div id="lock" hidden></div></div>
  <div id="log"></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
const $=id=>document.getElementById(id);
if(typeof THREE==="undefined"){$("err").style.display="flex";return}
const T=THREE;
const N=25, GROW=12000, YIELD=5, SEED=20, TRIP=9000, BOOST=900, MAXLV=6, KEY="poppy-farm-v1";
const fmt=n=>Math.round(n).toLocaleString("fa-IR");
const rnd=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
let S={money:150,stock:0,owned:3,price:45,prev:45,plots:Array(N).fill(0),trip:null};
try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&d.plots)S=d}catch(e){}
S.capLv=S.capLv||0;S.lockUntil=S.lockUntil||0;S.freePlot=S.freePlot||0;
const cap=()=>70+30*S.capLv,upCost=()=>Math.round(300*Math.pow(1.7,S.capLv));
const isLocked=i=>S.lockUntil>Date.now()&&i!==S.freePlot;
const landCost=()=>Math.round(250*Math.pow(1.45,S.owned-3));

/* ---------- صحنه ---------- */
const cv=$("gl");
const R=new T.WebGLRenderer({canvas:cv,antialias:true});
R.shadowMap.enabled=true;R.shadowMap.type=T.PCFSoftShadowMap;
R.outputEncoding=T.sRGBEncoding;R.toneMapping=T.ACESFilmicToneMapping;R.toneMappingExposure=1.05;
const scene=new T.Scene();
scene.fog=new T.Fog(0xd5e3ee,32,85);
const cam=new T.PerspectiveCamera(45,1,.1,200);
function tex(w,h,fn,rep){const c=document.createElement("canvas");c.width=w;c.height=h;fn(c.getContext("2d"),w,h);const t=new T.CanvasTexture(c);t.encoding=T.sRGBEncoding;if(rep){t.wrapS=t.wrapT=T.RepeatWrapping;t.repeat.set(rep,rep)}t.anisotropy=4;return t}
function noise(base,cols,n,len){return (g,w,h)=>{g.fillStyle=base;g.fillRect(0,0,w,h);for(let i=0;i<n;i++){g.strokeStyle=cols[i%cols.length];g.lineWidth=rnd(1,2.5);const x=rnd(0,w),y=rnd(0,h);g.beginPath();g.moveTo(x,y);g.lineTo(x+rnd(-len,len),y+rnd(-len,len));g.stroke()}}}
scene.background=tex(2,256,(g,w,h)=>{const gr=g.createLinearGradient(0,0,0,h);gr.addColorStop(0,"#6fa6e0");gr.addColorStop(.6,"#bcd8f0");gr.addColorStop(1,"#f4e6c8");g.fillStyle=gr;g.fillRect(0,0,w,h)});
const grassT=tex(512,512,noise("#4d7a30",["#5f8f3a","#3f6b28","#6b9a42","#557f33"],5000,7),28);
const soilT=tex(256,256,noise("#4a3022",["#5c3d2a","#38241a","#6a4a33","#2f1e15"],2500,3),1);
const dryT=tex(256,256,noise("#6f6a3d",["#7d7745","#5e5a34","#847e4c","#4f5a30"],2500,5),1);
const roadT=tex(256,256,noise("#9c8662",["#a8936d","#8a7551","#b09b76"],1500,3),6);
const tapeT=tex(128,16,(g,w,h)=>{g.fillStyle="#f2c200";g.fillRect(0,0,w,h);g.fillStyle="#111";for(let i=-1;i<9;i++){g.beginPath();g.moveTo(i*16,h);g.lineTo(i*16+8,h);g.lineTo(i*16+16,0);g.lineTo(i*16+8,0);g.fill()}});
const stripeT=tex(128,32,(g,w,h)=>{for(let i=0;i<8;i++){g.fillStyle=i%2?"#f3ead8":"#c43a2e";g.fillRect(i*16,0,16,h)}},0);

scene.add(new T.HemisphereLight(0xbfd8ff,0x5a4630,.75));
const sun=new T.DirectionalLight(0xfff0d2,1.7);sun.position.set(9,15,7);sun.castShadow=true;
sun.shadow.mapSize.set(innerWidth>900?4096:2048,innerWidth>900?4096:2048);sun.shadow.bias=-.0004;
Object.assign(sun.shadow.camera,{left:-16,right:16,top:16,bottom:-16,near:1,far:60});
scene.add(sun);
const fill=new T.DirectionalLight(0x9ab8ff,.35);fill.position.set(-8,6,-6);scene.add(fill);

const ground=new T.Mesh(new T.PlaneGeometry(220,220),new T.MeshStandardMaterial({map:grassT,roughness:1}));
ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
const road=new T.Mesh(new T.PlaneGeometry(60,2.4),new T.MeshStandardMaterial({map:roadT,roughness:1}));
road.rotation.x=-Math.PI/2;road.position.set(0,.02,7.6);road.receiveShadow=true;scene.add(road);

function tree(x,z,s){const g=new T.Group(),m=new T.MeshStandardMaterial({color:0x2f6b2c,roughness:.9});
  const tr=new T.Mesh(new T.CylinderGeometry(.18*s,.26*s,1.6*s,7),new T.MeshStandardMaterial({color:0x5a3e28,roughness:1}));tr.position.y=.8*s;
  const a=new T.Mesh(new T.ConeGeometry(1.2*s,2.2*s,8),m);a.position.y=2.4*s;
  const b=new T.Mesh(new T.ConeGeometry(.9*s,1.8*s,8),m);b.position.y=3.5*s;
  [tr,a,b].forEach(o=>{o.castShadow=true;g.add(o)});g.position.set(x,0,z);g.rotation.y=rnd(0,6);scene.add(g)}
for(let i=0;i<9;i++)tree(-15+i*3.8+rnd(-1,1),-11-rnd(0,3),rnd(.9,1.5));
for(let i=0;i<4;i++){tree(-12-rnd(0,2),-6+i*4,rnd(.9,1.4));tree(12+rnd(0,2),-6+i*4,rnd(.9,1.4))}

/* چمن و حصار */
(function(){
 const d=new T.Object3D(),c=new T.Color();
 const ok=(x,z)=>!(Math.abs(x)<6.9&&z>-6.9&&z<6.4)&&!(z>6.1&&z<9.2);
 const gm=new T.MeshStandardMaterial({color:0xffffff,roughness:1}),gg=new T.ConeGeometry(.045,.55,4);gg.translate(0,.27,0);
 const M=3500,gi=new T.InstancedMesh(gg,gm,M);let k=0;
 while(k<M){const x=rnd(-26,26),z=rnd(-16,18);if(!ok(x,z))continue;
  d.position.set(x,0,z);d.rotation.set(rnd(-.25,.25),rnd(0,6),rnd(-.25,.25));d.scale.set(rnd(.7,1.4),rnd(.6,1.6),rnd(.7,1.4));d.updateMatrix();gi.setMatrixAt(k,d.matrix);c.setHSL(rnd(.22,.32),rnd(.45,.65),rnd(.22,.4));gi.setColorAt(k,c);k++}
 gi.receiveShadow=true;scene.add(gi);
 const F=300,fi=new T.InstancedMesh(new T.SphereGeometry(.06,8,6),new T.MeshStandardMaterial({color:0xffffff,roughness:.6}),F),fc=[0xffffff,0xffe14a,0xf4a6d0,0xb48cf0];k=0;
 while(k<F){const x=rnd(-26,26),z=rnd(-16,18);if(!ok(x,z))continue;
  d.position.set(x,.35,z);d.rotation.set(0,0,0);d.scale.setScalar(rnd(.8,1.3));d.updateMatrix();fi.setMatrixAt(k,d.matrix);c.setHex(fc[k%4]);fi.setColorAt(k,c);k++}
 scene.add(fi);
 const wm=new T.MeshStandardMaterial({color:0x8a6440,roughness:1}),pg=new T.BoxGeometry(.14,1,.14);pg.translate(0,.5,0);
 const pi=new T.InstancedMesh(pg,wm,40);let n=0;
 const addP=(x,z)=>{d.position.set(x,0,z);d.rotation.set(0,0,0);d.scale.set(1,rnd(.9,1.1),1);d.updateMatrix();pi.setMatrixAt(n++,d.matrix)};
 for(let i=-4;i<=4;i++)addP(i*1.6,-6.6);
 for(let i=1;i<=7;i++){const z=-6.6+i*1.65;addP(-6.6,z);addP(6.6,z)}
 pi.count=n;pi.castShadow=true;scene.add(pi);
 const rail=(w,dd,x,y,z)=>{const r=new T.Mesh(new T.BoxGeometry(w,.07,dd),wm);r.position.set(x,y,z);r.castShadow=true;scene.add(r)};
 [.5,.85].forEach(y=>{rail(13.4,.06,0,y,-6.6);rail(.06,11.6,-6.6,y,-.8);rail(.06,11.6,6.6,y,-.8)});
})();

/* بازار */
(function(){const g=new T.Group(),wood=new T.MeshStandardMaterial({color:0x7a5532,roughness:.9});
  const cn=new T.Mesh(new T.BoxGeometry(2.6,1,1.1),wood);cn.position.y=.5;
  const ca=new T.Mesh(new T.BoxGeometry(3.2,.12,2),new T.MeshStandardMaterial({map:stripeT,roughness:.8}));ca.position.set(0,2.2,-.2);ca.rotation.x=.2;
  [[-1.4,.5],[1.4,.5]].forEach(p=>{const po=new T.Mesh(new T.CylinderGeometry(.06,.06,2.2,6),wood);po.position.set(p[0],1.1,p[1]-.7);po.castShadow=true;g.add(po)});
  for(let i=0;i<3;i++){const c=new T.Mesh(new T.BoxGeometry(.6,.5,.6),wood);c.position.set(-2.2+i*.7,.25,.9);c.castShadow=true;g.add(c)}
  [cn,ca].forEach(o=>{o.castShadow=true;o.receiveShadow=true;g.add(o)});
  g.position.set(-8.6,0,10);scene.add(g)})();

/* انبار */
const barn=new T.Group(),barnCrates=[];let barnLv=-1;
(function(){const wall=new T.MeshStandardMaterial({color:0x8c2f26,roughness:.9}),trim=new T.MeshStandardMaterial({color:0xefe6d4,roughness:.8}),roofM=new T.MeshStandardMaterial({color:0x4a4f58,roughness:.7,metalness:.3}),wd=new T.MeshStandardMaterial({color:0x6a4a2e,roughness:1});
 const add=(g,m,x,y,z,rx)=>{const o=new T.Mesh(g,m);o.position.set(x,y,z);if(rx)o.rotation.x=rx;o.castShadow=true;o.receiveShadow=true;barn.add(o);return o};
 add(new T.BoxGeometry(3.2,1.7,2.6),wall,0,.85,0);add(new T.BoxGeometry(1.1,1.4,.06),trim,0,.7,1.31);add(new T.BoxGeometry(.9,1.25,.06),wd,0,.63,1.34);
 add(new T.BoxGeometry(3.5,.1,1.7),roofM,0,2.05,.72,.55);add(new T.BoxGeometry(3.5,.1,1.7),roofM,0,2.05,-.72,-.55);
 const sh=new T.Shape();sh.moveTo(-1.3,0);sh.lineTo(1.3,0);sh.lineTo(0,.85);sh.lineTo(-1.3,0);
 [-1.6,1.6].forEach(x=>{const o=add(new T.ExtrudeGeometry(sh,{depth:.05,bevelEnabled:false}),wall,x,1.7,0);o.rotation.y=Math.PI/2});
 for(let k=0;k<6;k++){const c=add(new T.BoxGeometry(.5,.5,.5),wd,2.1+(k%3)*.55,.25,.3+(k>2?.6:0));c.visible=false;barnCrates.push(c)}
 barn.position.set(-8,0,-9.8);barn.rotation.y=.25;scene.add(barn)})();

/* ابرها */
const clouds=[];
const cloudT=tex(128,128,(g,w,h)=>{const r=g.createRadialGradient(64,64,4,64,64,62);r.addColorStop(0,"rgba(255,255,255,.9)");r.addColorStop(1,"rgba(255,255,255,0)");g.fillStyle=r;g.fillRect(0,0,w,h)});
for(let i=0;i<7;i++){const s=new T.Sprite(new T.SpriteMaterial({map:cloudT,transparent:true,opacity:.8,depthWrite:false,fog:false}));s.scale.set(rnd(10,18),rnd(4,7),1);s.position.set(rnd(-40,40),rnd(14,22),rnd(-40,-18));scene.add(s);clouds.push(s)}

/* ---------- زمین‌ها و بوته‌ها ---------- */
const soilM=new T.MeshStandardMaterial({map:soilT,bumpMap:soilT,bumpScale:.9,roughness:1}),dryM=new T.MeshStandardMaterial({map:dryT,bumpMap:dryT,bumpScale:.6,roughness:1});
const ridgeM=new T.MeshStandardMaterial({color:0x3b261a,roughness:1,map:soilT});
const stemM=new T.MeshStandardMaterial({color:0x5b9a58,roughness:.7}),leafM=new T.MeshStandardMaterial({color:0x6aa86a,roughness:.7,side:T.DoubleSide});
const petM=new T.MeshStandardMaterial({color:0xe3263c,roughness:.55,emissive:0x330008}),darkM=new T.MeshStandardMaterial({color:0x3a0a22,roughness:.8}),podM=new T.MeshStandardMaterial({color:0x9fb88c,roughness:.6});
const petM2=new T.MeshStandardMaterial({color:0xd01f6a,roughness:.55,emissive:0x2a0010});
const stemG=new T.CylinderGeometry(.022,.036,1,6);stemG.translate(0,.5,0);
const sphG=new T.SphereGeometry(1,16,12),ridgeG=new T.CylinderGeometry(.13,.16,1.8,8);ridgeG.rotateZ(Math.PI/2);
function makePlant(){
  const g=new T.Group(),stem=new T.Mesh(stemG,stemM);stem.castShadow=true;g.add(stem);
  const leaves=[0,1].map(k=>{const l=new T.Mesh(sphG,leafM);l.scale.set(.2,.025,.075);l.position.x=(k?-1:1)*.12;l.rotation.z=(k?-1:1)*.35;l.castShadow=true;const p=new T.Group();p.add(l);p.rotation.y=k*2.2;g.add(p);return p});
  const F=new T.Group(),pod=new T.Mesh(sphG,podM);pod.scale.setScalar(.085);pod.castShadow=true;F.add(pod);
  const dot=new T.Mesh(sphG,darkM);dot.scale.set(.06,.03,.06);dot.position.y=.04;F.add(dot);
  const pets=[],pm=Math.random()<.25?petM2:petM;for(let k=0;k<6;k++){const pv=new T.Group();pv.rotation.y=-k*Math.PI*2/6+rnd(-.1,.1);const p=new T.Mesh(sphG,pm);const w=k%2?.19:.16;p.scale.set(w,.03,.15);p.position.set(.125,.05+(k%2)*.012,0);p.rotation.z=.4+(k%2)*.12;pv.add(p);F.add(pv);pets.push(pv)}
  F.rotation.x=.12;g.add(F);
  return{g,stem,leaves,F,pod,pets,ph:rnd(0,6.3)};
}
const plots=[],soils=[];
for(let i=0;i<N;i++){
  const col=i%5,row=Math.floor(i/5),g=new T.Group();g.position.set((col-2)*2.3,0,(row-2)*2.3);
  const soil=new T.Mesh(new T.BoxGeometry(2,.3,2),dryM);soil.position.y=.15;soil.receiveShadow=true;soil.castShadow=true;soil.userData.i=i;g.add(soil);soils.push(soil);
  const ridges=[],plants=[];

  const tr=S.trip,f=tr?Math.min(1,(now-tr.start)/TRIP):0,cx=tr?7-14*f:7;
  const dx=cx-cart.position.x;cart.position.x=cx;cart.position.y=tr?Math.abs(Math.sin(t*10))*.04:0;
  wheels.forEach(w=>w.rotation.z+=-dx/.36);
  if(tr){dacc+=dt;if(dacc>.05){dacc=0;const d=dust[dn++%dust.length];d.userData.life=1;d.position.set(cart.position.x+1.9,.3,cart.position.z+rnd(-.5,.5));d.visible=true}}
  dust.forEach(d=>{if(d.userData.life>0){d.userData.life-=dt*1.1;const l=d.userData.life;d.material.opacity=Math.max(0,l)*.5;d.scale.setScalar(1.2+(1-l)*2.4);d.position.y+=dt*.3;if(l<=0)d.visible=false}});
  const ld=tr?tr.qty:S.stock,ns=ld>0?Math.min(5,Math.ceil(ld/14)):0;sacks.forEach((s,k)=>s.visible=k<ns);
  clouds.forEach(c=>{c.position.x+=dt*.6;if(c.position.x>50)c.position.x=-50});
  if(barnLv!==S.capLv){barnLv=S.capLv;barn.scale.setScalar(.85+.1*barnLv);barnCrates.forEach((c,k)=>c.visible=k<barnLv)}
  R.render(scene,cam);requestAnimationFrame(frame);
}
if(!S.trip&&S.stock===0&&S.plots.every(x=>!x))log("سه قطعه زمین و ۱۵۰ پول داری. بذر بکار و تند تند روی زمین کلیک کن تا زودتر رشد کند. با کشیدن صفحه، دوربین می‌چرخد.");
render();setInterval(render,500);frame();
})();
</script>
